name: reliq_app
description: "Reliq - Faith, Community & Connection"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  # UI & Navigation
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  get: ^4.6.6

  # State Management
  provider: ^6.1.2

  # Storage
  shared_preferences: ^2.2.3

  # Networking
  http: ^1.2.1
  dio: ^5.4.0

  # Images & File Handling
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  image_cropper: ^7.0.0

  # Offline Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Notifications
  flutter_local_notifications: ^17.1.1

  # Location Services
  geolocator: ^11.0.0
  google_maps_flutter: ^2.5.3

  # Firebase (Authentication, Database, Storage, Notifications)
  firebase_core: ^2.30.1
  firebase_auth: ^4.20.0
  cloud_firestore: ^4.16.0
  firebase_storage: ^11.7.0
  firebase_messaging: ^14.9.4

  # QR Code & Barcodes
  qr_flutter: ^4.1.0
  barcode_widget: ^2.0.4

  # Date & Time Formatting
  intl: ^0.19.0

  # Lottie Animations
  lottie: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.6
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/icons/
    - assets/logos/
    - assets/animations/
    - assets/data/

  # Fonts
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
    - family: DMSerifDisplay
      fonts:
        - asset: assets/fonts/DMSerifDisplay-Regular.ttf