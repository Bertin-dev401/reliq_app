name: reliq_app
description: "Reliq - Faith, Community & Connection"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Navigation
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  get: ^4.6.6

  # State Management
  provider: ^6.1.2

  # Local Storage
  shared_preferences: ^2.2.3

  # Networking
  http: ^1.2.1
  dio: ^5.4.0

  # Firebase — core must be first, everything else depends on it
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  firebase_analytics: ^11.3.3
  firebase_storage: ^12.3.2

  # Performance
  # Caches network images locally so they don't reload on every screen visit.
  # Critical for slow networks — images load instantly after first fetch.
  cached_network_image: ^3.4.1

  # Detects when the user goes offline and lets us show proper messages
  # instead of spinners that never end or silent crashes.
  connectivity_plus: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
